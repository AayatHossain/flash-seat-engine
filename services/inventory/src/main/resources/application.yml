spring:
  application:
    name: inventory
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}

server:
  port: 8081

flashseat:
  hold:
    duration: 10m
    max-seats-per-hold: 8
    sweeper:
      enabled: true
      interval: 5s
      batch-size: 500
  admission:
    # The default is for local development only. Real deployments pass ADMISSION_SECRET from a secret store.
    secret: ${ADMISSION_SECRET:local-development-only-secret-0123456789}
    validity: 10m
  rate-limit:
    capacity: 5
    refill-per-second: 1.0

management:
  endpoint:
    health:
      probes:
        enabled: true
