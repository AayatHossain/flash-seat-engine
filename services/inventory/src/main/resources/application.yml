spring:
  application:
    name: inventory
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8081

flashseat:
  hold:
    duration: 10m
    max-seats-per-hold: 8
    sweeper:
      enabled: true
      interval: 5s
      batch-size: 500
  admission:
    # The default is for local development only. Real deployments pass ADMISSION_SECRET from a secret store.
    secret: ${ADMISSION_SECRET:local-development-only-secret-0123456789}
    validity: 10m
  rate-limit:
    # "redis" shares limits across all replicas; "memory" keeps them per instance (useful without Redis).
    store: ${RATE_LIMIT_STORE:redis}
    capacity: 5
    refill-per-second: 1.0
  waiting-room:
    admit-per-second: 100
    queue-retention: 2d
  event-page:
    # A seat map up to 2 s old is fine: holding a seat is always checked by Postgres.
    ttl: 2s
    lock-timeout: 3s
    wait-for-rebuild: 1s

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        # Prometheus scrapes each replica directly on the private network; NGINX never routes /actuator.
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Real latency histograms, so percentiles can be summed across replicas in Prometheus.
      percentiles-histogram:
        http.server.requests: true
      # Exact bucket edges at the SLO thresholds.
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s
  tracing:
    sampling:
      # Every request is traced locally. Under real traffic a fraction (for example 0.1) is enough.
      probability: ${TRACING_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
