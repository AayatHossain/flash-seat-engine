spring:
  application:
    name: inventory
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}

server:
  port: 8081

flashseat:
  hold:
    duration: 10m
    max-seats-per-hold: 8

management:
  endpoint:
    health:
      probes:
        enabled: true
