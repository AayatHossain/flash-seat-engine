# Test-only overrides. Spring Boot also loads src/main/resources/application.yml; this file wins where both set a value.
flashseat:
  idempotency:
    lease: 2s
    cleanup:
      # Tests call the cleanup directly, so the background schedule must not run.
      enabled: false
  outbox:
    batch-size: 5
    send-timeout: 5s
    publisher:
      # Tests call the publisher directly.
      enabled: false
