spring:
  application:
    name: order
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Wait for every in-sync replica, and let the producer drop its own retried duplicates.
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

server:
  port: 8082

flashseat:
  inventory:
    base-url: ${INVENTORY_URL:http://localhost:8081}
    connect-timeout: 1s
    read-timeout: 2s
  idempotency:
    # How long a request may run before a retry is allowed to take over its key.
    lease: 30s
    # How long finished keys are remembered.
    retention: 24h
    cleanup:
      enabled: true
      interval: 1h
  payments:
    # "fake" behaves like Stripe in memory; "stripe" will use the real Stripe test API.
    provider: ${PAYMENT_PROVIDER:fake}
    # The default is for local development only. Real deployments pass the provider's signing secret.
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:whsec_local_development_only}
    # Webhooks signed longer ago than this are refused, so a captured one cannot be replayed.
    webhook-tolerance: 5m
  outbox:
    topic: order.events
    topic-partitions: 6
    topic-replicas: 1
    batch-size: 100
    send-timeout: 10s
    publisher:
      enabled: true
      interval: 500ms

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        # Prometheus scrapes each replica directly on the private network; NGINX never routes /actuator.
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Real latency histograms, so percentiles can be summed across replicas in Prometheus.
      percentiles-histogram:
        http.server.requests: true
      # Exact bucket edges at the SLO thresholds.
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s
  tracing:
    sampling:
      # Every request is traced locally. Under real traffic a fraction (for example 0.1) is enough.
      probability: ${TRACING_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    # The Kafka client prints its whole configuration at INFO on every start.
    org.apache.kafka: WARN
