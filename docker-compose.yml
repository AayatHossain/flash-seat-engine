# Local development infrastructure. Passwords here are for local use only.
name: flash-seat-engine

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.12.0-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: flash-seat-local-cluster
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL is for other containers, EXTERNAL for apps running on the host.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Catches every email the system sends. Open http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "1025:1025"
      - "8025:8025"

  # ---- The application itself. Start it with:  docker compose --profile apps up -d --build ----
  # Each service runs as 2 replicas behind NGINX. Only NGINX is reachable from the host (port 8080).

  inventory:
    profiles: [apps]
    build:
      context: .
      args: { SERVICE: inventory, PORT: 8081 }
    image: flash-seat/inventory:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      REDIS_HOST: redis
      OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    deploy:
      replicas: 2
      resources:
        limits: { memory: 512M }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  order:
    profiles: [apps]
    build:
      context: .
      args: { SERVICE: order, PORT: 8082 }
    image: flash-seat/order:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orders
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Through NGINX's internal entrance, so calls to inventory are load balanced too.
      INVENTORY_URL: http://nginx:8090
      OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    deploy:
      replicas: 2
      resources:
        limits: { memory: 512M }
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  worker:
    profiles: [apps]
    build:
      context: .
      args: { SERVICE: worker, PORT: 8083 }
    image: flash-seat/worker:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tickets
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_HOST: mailpit
      OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    deploy:
      replicas: 2
      resources:
        limits: { memory: 512M }
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      mailpit: { condition: service_started }

  nginx:
    profiles: [apps]
    image: nginx:1.30.8-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      inventory: { condition: service_healthy }
      order: { condition: service_healthy }

  # Metrics: Prometheus at http://localhost:9090, dashboards at http://localhost:3000.
  prometheus:
    profiles: [apps]
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Keeps a trace ID next to latency samples, so Grafana can jump from a slow request to its trace.
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  # Traces: open http://localhost:16686. Kept in memory, so they are gone after a restart.
  jaeger:
    profiles: [apps]
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "16686:16686"

  grafana:
    profiles: [apps]
    image: grafana/grafana:13.3.2
    ports:
      - "3000:3000"
    environment:
      # Anyone on this machine may view dashboards without logging in; editing needs admin/admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/flash-seat-engine.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
