worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Docker's DNS returns one address per replica; NGINX spreads requests across all of them.
    # A replica that fails is skipped for 10 seconds.
    # "zone" shares the balancing state between NGINX's worker processes; without it each worker
    # balances on its own and light traffic piles onto the first replica.
    upstream inventory {
        zone inventory 64k;
        least_conn;
        server inventory:8081 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream order {
        zone order 64k;
        least_conn;
        server order:8082 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr time=$upstream_response_time';
    access_log /var/log/nginx/access.log upstream;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    # If a replica dies mid-request, retry another one, but only for requests that are safe to repeat.
    proxy_next_upstream error timeout http_502 http_503;

    # Public entrance for buyers and the payment provider.
    server {
        listen 80;

        # Shows which replica answered. Handy for seeing load balancing; drop it in production.
        add_header X-Served-By $upstream_addr always;

        # Service-to-service endpoints are never reachable from outside.
        location /internal/ {
            return 404;
        }

        location /events/ {
            proxy_pass http://inventory;
        }

        location /orders {
            proxy_pass http://order;
        }

        location /payments/ {
            proxy_pass http://order;
        }

        location = /healthz {
            return 200 "ok\n";
        }
    }

    # Internal entrance, only on the Docker network: the order service reaches inventory through here,
    # so its calls are load balanced too.
    server {
        listen 8090;

        location /internal/ {
            proxy_pass http://inventory;
        }

        location /events/ {
            proxy_pass http://inventory;
        }
    }
}
