apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
      # Clicking an exemplar dot opens that request's trace in the Jaeger UI. A plain link is used because
      # Grafana's Jaeger data source still calls the old /api/* endpoints that Jaeger 2.22+ no longer serves.
      # ($$ stops Grafana from reading ${...} as an environment variable.)
      exemplarTraceIdDestinations:
        - name: trace_id
          url: http://localhost:16686/trace/$${__value.raw}
          urlDisplayLabel: Open trace in Jaeger
