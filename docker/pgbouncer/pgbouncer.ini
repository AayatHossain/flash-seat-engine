; Every service connects here instead of to Postgres. Each replica keeps its own small connection pool,
; and PgBouncer multiplexes all of them onto a few real Postgres connections.

[databases]
inventory = host=postgres dbname=inventory
orders = host=postgres dbname=orders
tickets = host=postgres dbname=tickets
; The read-only copy, used for event pages.
inventory_replica = host=postgres-replica dbname=inventory

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; A Postgres connection is lent to a client for one transaction, then returned. Safe for this codebase
; because every lock we take is transaction-scoped (FOR UPDATE, pg_try_advisory_xact_lock).
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 10
reserve_pool_size = 5
; Lets the JDBC driver keep its prepared statements in transaction mode.
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits,options
