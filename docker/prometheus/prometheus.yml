global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

# Docker's DNS returns one address per replica, so every replica is scraped on its own
# and new replicas are picked up automatically when the service is scaled.
scrape_configs:
  - job_name: inventory
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [inventory]
        type: A
        port: 8081
        refresh_interval: 10s

  - job_name: order
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [order]
        type: A
        port: 8082
        refresh_interval: 10s

  - job_name: worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 8083
        refresh_interval: 10s
